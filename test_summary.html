<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>动态布局</title>
  <style>
    .container {
      display: flex;
      flex-wrap: wrap; /* 允许换行 */
      gap: 0.5rem; /* 块之间的间距 */
    }

    .box {
      flex: 1; /* 使每个块占据相等的空间 */
      text-align: center; /* 文本居中 */
      padding: 0.5rem; /* 内边距 */
      border-radius: 0.25rem; /* 圆角 */
    }

    .box-1 {
      background-color: #f7fafc; /* 浅灰色 */
      min-width: 150px; /* 设置最小宽度以确保换行 */
    }

    .box-2 {
      background-color: #edf2f7; /* 中灰色 */
      min-width: 150px; /* 设置最小宽度以确保换行 */
    }

    .box-3 {
      background-color: #e2e8f0; /* 深灰色 */
      min-width: 150px; /* 设置最小宽度以确保换行 */
    }
  </style>
</head>
<body>
<div class="container">
  <div class="box box-1">块 1</div>
  <div class="box box-2">块 2</div>
  <div class="box box-3">块 3</div>
</div>
</body>
</html>
